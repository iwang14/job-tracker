name: jobpipe

on:
  schedule:
    # Hourly full run: every company + community lists + sheet sync + digest/weekly/reminders.
    # Odd minutes because GitHub delays/drops more scheduled runs at :00.
    - cron: "7 * * * *"
    # Extra Tier-1 pass at :37 from 07:37 to 23:37 Toronto (EDT; one hour earlier in winter).
    - cron: "37 11-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | tier1 | verify | seed | suggestions | digest"
        type: choice
        options: [run, tier1, verify, seed, suggestions, digest]
        default: run
      record:
        description: "verify: save raw API responses as an artifact (fixtures)"
        type: boolean
        default: false

# One run at a time, never cancelled mid-way: runs share the state branch.
concurrency:
  group: jobpipe-state
  cancel-in-progress: false

permissions:
  contents: write   # push the state branch

jobs:
  jobpipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '37 11-23,0-3 * * *' && 'tier1' || 'run') || inputs.mode }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      NOTIFIER: ${{ vars.NOTIFIER }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOBPIPE_CONTACT: ${{ vars.JOBPIPE_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt

      - name: Restore state
        id: restore
        if: env.MODE != 'verify' && env.MODE != 'seed'
        run: scripts/state.sh restore

      - name: Run (${{ env.MODE }})
        run: |
          case "$MODE" in
            run)         python -m jobpipe run ;;
            tier1)       python -m jobpipe run --tiers 1 --no-sheet --no-community ;;
            digest)      python -m jobpipe digest --send ;;
            suggestions) python -m jobpipe suggestions --export suggested_companies.yaml --verify ;;
            seed)        python -m jobpipe seed ;;
            verify)      python -m jobpipe verify ${{ inputs.record && '--record fixtures-live' || '' }} ;;
          esac

      - name: Save state
        if: always() && steps.restore.outcome == 'success' && (env.MODE == 'run' || env.MODE == 'tier1' || env.MODE == 'suggestions')
        run: scripts/state.sh save

      - name: Upload review files
        if: always() && (env.MODE == 'seed' || env.MODE == 'suggestions' || env.MODE == 'verify')
        uses: actions/upload-artifact@v4
        with:
          name: jobpipe-${{ env.MODE }}
          path: |
            config/companies.candidates.yaml
            suggested_companies.yaml
            fixtures-live/
          if-no-files-found: ignore
          retention-days: 7
